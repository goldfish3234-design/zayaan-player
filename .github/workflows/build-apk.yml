name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --org com.zayaan --project-name zayaan_player .

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="ZAYAAN"/' android/app/src/main/AndroidManifest.xml

      - name: Force compileSdk 36 for plugins
        run: |
          if [ -f android/build.gradle.kts ]; then
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              if (!project.state.executed) {
                  project.afterEvaluate {
                      if (project.hasProperty("android")) {
                          project.extensions.configure<com.android.build.gradle.BaseExtension> {
                              compileSdkVersion(36)
                          }
                      }
                  }
              }
          }
          EOF
          else
          cat >> android/build.gradle <<'EOF'

          subprojects {
              if (!project.state.executed) {
                  project.afterEvaluate {
                      if (project.hasProperty("android")) {
                          project.android {
                              compileSdkVersion 36
                          }
                      }
                  }
              }
          }
          EOF
          fi

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zayaan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
