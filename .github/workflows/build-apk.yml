name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --org com.zayaan --project-name zayaan_player .

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="ZEVN Player"/' android/app/src/main/AndroidManifest.xml

      - name: Add permissions and playback service
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application#' $M
          sed -i 's#</application>#    <service android:name=".KeepAliveService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>\n    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7766896185357745~8296911465"/>\n    </application>#' $M
          cat $M

      - name: Set minSdk 24 (needed by ads plugin)
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] || continue
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$f"
            grep -n -i 'minsdk' "$f" || true
          done

      - name: Add Z launcher icon
        run: cp -r android_res/. android/app/src/main/res/

      - name: Add native code (brightness, volume, background playback, album art)
        run: |
          F=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          echo "MainActivity at: $F"
          cp android_native/MainActivity.kt "$F"
          cp android_native/KeepAliveService.kt "$(dirname "$F")/KeepAliveService.kt"

      - name: Force compileSdk 36 for plugins
        run: |
          if [ -f android/build.gradle.kts ]; then
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              if (!project.state.executed) {
                  project.afterEvaluate {
                      if (project.hasProperty("android")) {
                          project.extensions.configure<com.android.build.gradle.BaseExtension> {
                              compileSdkVersion(36)
                          }
                      }
                  }
              }
          }
          EOF
          else
          cat >> android/build.gradle <<'EOF'

          subprojects {
              if (!project.state.executed) {
                  project.afterEvaluate {
                      if (project.hasProperty("android")) {
                          project.android {
                              compileSdkVersion 36
                          }
                      }
                  }
              }
          }
          EOF
          fi

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zayaan-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to Releases (direct download, no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ZEVN.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ZEVN.apk --title "ZEVN Player latest APK" --notes "Latest build. Download ZEVN.apk and install." --target "${{ github.sha }}"
